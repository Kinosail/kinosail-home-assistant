[project]
name = "kinosail-home-assistant"
version = "0.3.0"
requires-python = ">=3.14.2"
dependencies = ["aiohttp==3.14.3"]

[project.optional-dependencies]
test = [
    "complexipy==8.0.1",
    "mutmut==3.8.0",
    "pre-commit==4.6.2",
    "pylint==4.0.8",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.366",
    "radon==6.0.1",
    "ruff==0.16.8",
    "vulture==2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["custom_components/kinosail"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mutmut]
source_paths = ["custom_components/kinosail"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = ["tests"]
# Coverage is enforced separately. Reloading C-extension modules during the
# coverage prepass breaks dbus-fast enum identity on Linux. Mutate every line.
mutate_only_covered_lines = false
use_git_change_detection = false
also_copy = [".github", ".python-version", "hacs.json", "scripts"]
cache_invalidation_files = [
    ".github/workflows/validate.yml",
    ".python-version",
    "custom_components/kinosail/manifest.json",
    "hacs.json",
    "tests/**/*.py",
]
on_dependency_change = "rerun"
do_not_mutate_patterns = [
    "^\\s*raise ",
    "cast\\(",
]
